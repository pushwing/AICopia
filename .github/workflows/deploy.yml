name: Deploy

# main에 머지(push)되면 잡이 큐에 들어가고, production 환경의
# Required reviewers 승인을 받은 뒤에야 SSH 배포가 실행된다(= 머지 후 수동 승인).
# 마이그레이션은 자동 실행하지 않는다(수동). 필요할 때 Actions 탭에서
# workflow_dispatch로 run_migration=true 를 선택해 실행한다.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migration:
        description: "이 배포에서 DB 마이그레이션(php spark migrate --all) 실행"
        type: boolean
        default: false

# 배포는 한 번에 하나만. 진행 중 배포를 끊지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 운영 배포 (수동 승인)
    runs-on: ubuntu-latest
    # 이 environment에 Required reviewers를 설정하면 승인 게이트가 된다.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: SSH 배포
        uses: appleboy/ssh-action@v1.2.0
        env:
          # workflow_dispatch에서 run_migration=true 로 실행할 때만 true.
          RUN_MIGRATION: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migration == true }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          # script_stop 은 명령마다 $?를 검사해 non-zero면 중단하는데, if 조건의
          # [ ... ] 나 || / && 처럼 정상적으로 non-zero를 반환하는 명령까지 실패로
          # 오인해 중단시킨다(원격 셸이 zsh일 때 특히). 그래서 끄고, 스크립트 자체의
          # set -euo pipefail 로 에러를 처리한다(set -e 는 if 조건의 non-zero엔 중단 안 함).
          script_stop: false
          envs: RUN_MIGRATION
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            # 1) 최신 main 반영 (.env·gitignore된 스켈레톤 등 untracked 파일은 보존됨)
            git fetch --all --prune
            git reset --hard origin/main

            # 2) 운영 의존성 설치
            composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            # 2-1) gitignore된 표준 CI4 스켈레톤 복원 (vendor 프레임워크에서).
            #      없는 항목만 복사해 커스텀 Config·.env·기존 파일은 절대 덮어쓰지 않는다(멱등).
            #      cp -n 은 coreutils 9.x에서 비호환 경고 + 스킵 시 exit 1 이라 쓰지 않는다.
            for src in vendor/codeigniter4/framework/app/Config/*; do
              dest="app/Config/$(basename "$src")"
              [ -e "$dest" ] || cp -r "$src" "$dest"
            done
            [ -e system ]           || ln -s vendor/codeigniter4/framework/system system
            [ -f spark ]            || cp vendor/codeigniter4/framework/spark spark
            [ -f public/index.php ] || cp vendor/codeigniter4/framework/public/index.php public/index.php

            # 3) DB 마이그레이션 (수동) — workflow_dispatch에서 run_migration=true 일 때만 실행.
            #    실행 전 DB 백업을 권장한다(아래 mysqldump 주석 참고).
            if [ "${RUN_MIGRATION:-false}" = "true" ]; then
              # mkdir -p writable/backups
              # mysqldump -h "$DB_HOST" -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" \
              #   > "writable/backups/$(date +%F_%H%M%S).sql"
              echo "마이그레이션 실행..."
              php spark migrate --all
            else
              echo "마이그레이션 건너뜀(수동). 필요 시 Actions에서 run_migration=true 로 실행."
            fi

            # 4) 캐시 초기화
            php spark cache:clear

  # Slack 알림 — 운영 배포는 성공/실패/취소 모두 발송.
  # production 환경 밖의 별도 잡이라 승인 게이트 없이 배포 완료 직후 실행된다.
  # SLACK_WEBHOOK_URL 시크릿이 없으면 조용히 건너뛴다(배포에 영향 없음).
  notify:
    name: Slack 알림 (배포 결과)
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: 배포 결과 알림
        if: env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # 커밋 메시지는 따옴표/개행이 들어올 수 있어 toJSON()으로 안전하게 이스케이프한다.
          # 색상: 성공 초록 / 취소 노랑 / 실패 빨강.
          payload: |
            text: "${{ needs.deploy.result == 'success' && '✅ 운영 배포 성공' || needs.deploy.result == 'cancelled' && '⚠️ 운영 배포 취소됨' || '❌ 운영 배포 실패' }} — ${{ github.repository }}"
            attachments:
              - color: "${{ needs.deploy.result == 'success' && '#2eb67d' || needs.deploy.result == 'cancelled' && '#ecb22e' || '#e01e5a' }}"
                blocks:
                  - type: header
                    text:
                      type: plain_text
                      text: "${{ needs.deploy.result == 'success' && '✅ 운영 배포 성공' || needs.deploy.result == 'cancelled' && '⚠️ 운영 배포 취소됨' || '❌ 운영 배포 실패' }} — ${{ github.repository }}"
                      emoji: true
                  - type: section
                    fields:
                      - type: mrkdwn
                        text: "*트리거*\n${{ github.event_name == 'workflow_dispatch' && '수동 실행 (workflow_dispatch)' || 'main 머지 (push)' }}"
                      - type: mrkdwn
                        text: "*실행자*\n${{ github.actor }}"
                      - type: mrkdwn
                        text: "*DB 마이그레이션*\n${{ github.event_name == 'workflow_dispatch' && inputs.run_migration == true && '⚙️ 실행됨 (migrate --all)' || '건너뜀 (수동 정책)' }}"
                      - type: mrkdwn
                        text: "*커밋*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|커밋 보기>"
                  - type: section
                    text:
                      type: mrkdwn
                      text: ${{ toJSON(format('>{0}', github.event.head_commit.message || '(수동 실행 — 커밋 메시지 없음)')) }}
                  - type: section
                    text:
                      type: mrkdwn
                      text: "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔍 실행 로그 보기>${{ vars.PRODUCTION_URL != '' && format(' · <{0}|🌐 운영 사이트>', vars.PRODUCTION_URL) || '' }}"
